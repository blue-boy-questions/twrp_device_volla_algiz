name: Build TWRP (algiz / vendor_boot)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "TWRP minimal manifest branch"
        required: true
        default: "twrp-14.1"
      build_target:
        description: "mka target (vendorbootimage for this device)"
        required: true
        default: "vendorbootimage"
      lunch_combo:
        description: "lunch combo (A14+ needs the release token)"
        required: true
        default: "twrp_algiz-trunk_staging-eng"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Maximize build disk space
        run: |
          set -euo pipefail
          echo "=== BEFORE ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/graalvm /usr/local/.ghcup \
                      /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "=== AFTER ==="; df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libncurses-dev python3 openjdk-17-jdk-headless android-sdk-libsparse-utils \
            fontconfig e2fsprogs

      - name: Install repo tool
        run: |
          set -euo pipefail
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          git config --global user.name "twrp-ci"
          git config --global user.email "twrp-ci@localhost"
          git config --global color.ui false
          git config --global advice.detachedHead false

      - name: Prepare workspace on large disk
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/twrp
          sudo chown "$(id -u):$(id -g)" /mnt/twrp
          echo "WS=/mnt/twrp" >> "$GITHUB_ENV"

      - name: repo init + sync (minimal TWRP manifest)
        run: |
          set -euo pipefail
          cd "$WS"
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b "${{ inputs.manifest_branch }}" \
            --git-lfs --no-clone-bundle
          # Sync. TWRP minimal manifests are already lean; -c keeps it to the
          # current branch, --no-tags/--no-clone-bundle trim transfer.
          repo sync -c -j"$(nproc)" --force-sync --no-tags --no-clone-bundle \
            --optimized-fetch --prune
          echo "=== synced; disk now ==="; df -h / /mnt

      - name: Install device tree into the source
        run: |
          set -euo pipefail
          cd "$WS"
          mkdir -p device/volla/algiz
          # Copy everything except VCS / CI dirs into the device path.
          rsync -a --delete \
            --exclude '.git' --exclude '.github' \
            "$GITHUB_WORKSPACE/device_tree/" device/volla/algiz/
          echo "=== device tree contents ==="
          find device/volla/algiz -maxdepth 3 -type f | sort
          echo "=== assert prebuilt kernel is a gzip image ==="
          head -c4 device/volla/algiz/prebuilt/kernel.gz | od -An -tx1
          test -f device/volla/algiz/prebuilt/dtbo.img

      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          cd "$WS"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          # NOTE: do NOT use `set -u` here — AOSP's build/envsetup.sh references
          # unset vars ($TOP etc.) during sourcing and would abort under nounset.
          source build/envsetup.sh

          # AOSP 14+ lunch requires a release token: <product>-<release>-<variant>.
          # The valid release tokens come from build/release/release_configs and
          # vary by manifest. Resolve one that actually exists instead of guessing.
          want="${{ inputs.lunch_combo }}"
          echo "requested lunch combo: $want"
          if lunch "$want" 2>/tmp/lunch.err; then
            echo "lunch OK: $want"
          else
            echo "::warning::'$want' invalid; probing available release tokens"
            cat /tmp/lunch.err || true
            picked=""
            for rel in trunk_staging trunk ap1a ap2a bp1a next; do
              combo="twrp_algiz-${rel}-eng"
              if lunch "$combo" 2>/dev/null; then picked="$combo"; break; fi
            done
            if [ -z "$picked" ]; then
              echo "::error::no valid release token found for twrp_algiz"
              echo "---- list_products ----"; list_products 2>/dev/null | head || true
              echo "---- release configs ----"
              ls build/release/release_configs/*.textproto 2>/dev/null | sed 's#.*/##;s#\.textproto##' || true
              ls device/volla/algiz 2>/dev/null || true
              exit 1
            fi
            echo "lunch OK (fallback): $picked"
          fi

          set -o pipefail
          mka "${{ inputs.build_target }}" 2>&1 | tee /mnt/twrp/build.log | \
            grep -iE 'error:|warning: overriding|make.*Error|Install:|target .*img|Build.*complete|ninja: build|FAILED:' || true
          echo "=== build exit via PIPESTATUS ==="
          test "${PIPESTATUS[0]}" -eq 0

      - name: Collect outputs
        if: always()
        run: |
          set -euo pipefail
          cd "$WS"
          OUTDIR="out/target/product/algiz"
          mkdir -p /mnt/twrp/artifacts
          shopt -s nullglob
          for f in "$OUTDIR"/vendor_boot.img "$OUTDIR"/recovery.img \
                   "$OUTDIR"/boot.img "$OUTDIR"/ramdisk-recovery.*; do
            [ -f "$f" ] && cp -v "$f" /mnt/twrp/artifacts/ || true
          done
          # Always keep the tail of the build log for diagnosis.
          tail -c 400000 /mnt/twrp/build.log > /mnt/twrp/artifacts/build-tail.log || true
          echo "=== artifacts ==="
          ls -lh /mnt/twrp/artifacts || true
          ( cd /mnt/twrp/artifacts && sha256sum * > SHA256SUMS 2>/dev/null; cat SHA256SUMS ) || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-algiz-${{ github.run_number }}
          path: /mnt/twrp/artifacts/*
          if-no-files-found: warn
          retention-days: 14
