name: Build TWRP (algiz / vendor_boot)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "TWRP minimal manifest branch"
        required: true
        default: "twrp-14.1"
      build_target:
        description: "mka target (vendorbootimage for this device)"
        required: true
        default: "vendorbootimage"
      lunch_combo:
        description: "lunch combo (A14+ needs the release token)"
        required: true
        default: "twrp_algiz-ap2a-eng"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Maximize build disk space
        run: |
          set -euo pipefail
          echo "=== BEFORE ==="; df -h /; echo; free -h
          # Reclaim preinstalled toolchains we don't use (ubuntu-24.04). These are
          # self-contained directories (safe to rm) and are where the real space
          # is — NOT apt packages. Attempt 3 died with runner ENOSPC during image
          # assembly; everything is on one /dev/root fs.
          #
          # NOTE: do NOT `apt-get purge` these toolchains. Attempt 4 rm'd their
          # dirs then purged the matching packages, whose maintainer scripts then
          # failed on the missing files, leaving dpkg half-broken so the LATER
          # `apt-get install` of build deps aborted (google-cloud-cli, exit 100).
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/graalvm \
            /usr/lib/jvm \
            /usr/share/swift \
            /usr/local/lib/node_modules \
            /usr/local/share/powershell \
            /usr/share/miniconda \
            /usr/local/share/vcpkg \
            /opt/microsoft \
            /opt/pipx \
            /usr/local/julia* \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "=== AFTER ==="; df -h /

      - name: Add swap (runner has only ~16GB RAM; AOSP needs more)
        run: |
          set -euo pipefail
          echo "=== memory before ==="; free -h
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          # 16G is enough with the -j6 cap for a vendor_boot-only build, and
          # keeps 8G more disk free than the old 24G (everything is on one fs;
          # attempt 3 died with runner ENOSPC during image packaging).
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=100 || true
          echo "=== memory after ==="; free -h; echo; df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libncurses-dev python3 openjdk-17-jdk-headless android-sdk-libsparse-utils \
            fontconfig e2fsprogs

      - name: Install repo tool
        run: |
          set -euo pipefail
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          git config --global user.name "twrp-ci"
          git config --global user.email "twrp-ci@localhost"
          git config --global color.ui false
          git config --global advice.detachedHead false

      - name: Prepare workspace on large disk
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/twrp
          sudo chown "$(id -u):$(id -g)" /mnt/twrp
          echo "WS=/mnt/twrp" >> "$GITHUB_ENV"

      - name: repo init + sync (minimal TWRP manifest)
        run: |
          set -euo pipefail
          cd "$WS"
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b "${{ inputs.manifest_branch }}" \
            --git-lfs --no-clone-bundle
          repo sync -c -j"$(nproc)" --force-sync --no-tags --no-clone-bundle \
            --optimized-fetch --prune
          echo "=== synced; disk now ==="; df -h / /mnt

      - name: Install device tree into the source
        run: |
          set -euo pipefail
          cd "$WS"
          mkdir -p device/volla/algiz
          rsync -a --delete \
            --exclude '.git' --exclude '.github' \
            "$GITHUB_WORKSPACE/device_tree/" device/volla/algiz/
          echo "=== device tree contents ==="
          find device/volla/algiz -maxdepth 3 -type f | sort
          echo "=== assert prebuilt kernel is a gzip image ==="
          head -c4 device/volla/algiz/prebuilt/kernel.gz | od -An -tx1
          test -f device/volla/algiz/prebuilt/dtbo.img

      - name: Patch upstream TWRP for AOSP 14 NDK suffix rename
        shell: bash
        run: |
          set -euo pipefail
          cd "$WS"
          echo "=== occurrences before ==="
          grep -rln -- '-ndk_platform' bootable/recovery | sort || true
          grep -rl -- '-ndk_platform' bootable/recovery 2>/dev/null | while read -r f; do
            sed -i 's/-ndk_platform/-ndk/g' "$f"
            echo "patched: $f"
          done || true
          echo "=== occurrences after (should be none) ==="
          if grep -rln -- '-ndk_platform' bootable/recovery; then
            echo "::error::-ndk_platform still present after patch"; exit 1
          fi
          echo "clean"

      - name: Patch libtar for fscrypt v2 API (committed script)
        shell: bash
        run: |
          set -euo pipefail
          cd "$WS"
          python3 "$GITHUB_WORKSPACE/device_tree/patches/fix_libtar_fscrypt_v2.py" "$WS"

      - name: Remove deprecated FDE codepaths (committed script)
        shell: bash
        run: |
          set -euo pipefail
          cd "$WS"
          python3 "$GITHUB_WORKSPACE/device_tree/patches/fix_fde_removal.py" "$WS"

      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          cd "$WS"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          # NOTE: do NOT use `set -u` here — AOSP's build/envsetup.sh references
          # unset vars ($TOP etc.) during sourcing and would abort under nounset.
          source build/envsetup.sh

          want="${{ inputs.lunch_combo }}"
          echo "requested lunch combo: $want"
          if lunch "$want" 2>/tmp/lunch.err; then
            echo "lunch OK: $want"
          else
            echo "::warning::'$want' invalid; probing available release tokens"
            cat /tmp/lunch.err || true
            picked=""
            for rel in ap2a ap1a trunk_staging trunk bp1a next; do
              combo="twrp_algiz-${rel}-eng"
              if lunch "$combo" 2>/dev/null; then picked="$combo"; break; fi
            done
            if [ -z "$picked" ]; then
              echo "::error::no valid release token found for twrp_algiz"
              echo "---- list_products ----"; list_products 2>/dev/null | head || true
              echo "---- release configs ----"
              ls build/release/release_configs/*.textproto 2>/dev/null | sed 's#.*/##;s#\.textproto##' || true
              ls device/volla/algiz 2>/dev/null || true
              exit 1
            fi
            echo "lunch OK (fallback): $picked"
          fi

          # Cap parallelism: with only ~16GB RAM + swap, full -j(nproc) link
          # steps thrash and get OOM-killed. Use a memory-aware job count.
          jobs="$(nproc)"
          if [ "$jobs" -gt 6 ]; then jobs=6; fi
          echo "building with -j$jobs"
          # Capture mka's REAL exit status. The pipeline is mka|tee|grep; grep
          # exits 1 when it filters out everything, so we must read
          # PIPESTATUS[0] (mka) IMMEDIATELY — before any other command runs,
          # or it gets clobbered (this was the false-green bug).
          set +e
          mka -j"$jobs" "${{ inputs.build_target }}" 2>&1 | tee /mnt/twrp/build.log | \
            grep -iE 'error:|warning: overriding|make.*Error|Install:|target .*img|Build.*complete|ninja: build|FAILED:'
          rc="${PIPESTATUS[0]}"
          set -e
          echo "=== mka exit status: $rc ==="
          if [ "$rc" -ne 0 ]; then
            echo "::error::mka failed with status $rc"
            exit "$rc"
          fi
          # Real success criterion: the output image must actually exist.
          OUT="out/target/product/algiz/vendor_boot.img"
          if [ ! -f "$OUT" ]; then
            echo "::error::mka returned 0 but $OUT was not produced"
            exit 1
          fi
          echo "=== produced: $OUT ($(stat -c%s "$OUT") bytes) ==="

      - name: Collect outputs
        if: always()
        run: |
          set -euo pipefail
          cd "$WS"
          OUTDIR="out/target/product/algiz"
          mkdir -p /mnt/twrp/artifacts
          shopt -s nullglob
          for f in "$OUTDIR"/vendor_boot.img "$OUTDIR"/recovery.img \
                   "$OUTDIR"/boot.img "$OUTDIR"/ramdisk-recovery.*; do
            [ -f "$f" ] && cp -v "$f" /mnt/twrp/artifacts/ || true
          done
          tail -c 400000 /mnt/twrp/build.log > /mnt/twrp/artifacts/build-tail.log || true
          echo "=== artifacts ==="
          ls -lh /mnt/twrp/artifacts || true
          ( cd /mnt/twrp/artifacts && sha256sum * > SHA256SUMS 2>/dev/null; cat SHA256SUMS ) || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-algiz-${{ github.run_number }}
          path: /mnt/twrp/artifacts/*
          if-no-files-found: warn
          retention-days: 14
